[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shipmerge-backend"
version = "0.1.0"
description = "ShipMerge multi-tenant logistics consolidation & risk prediction backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "redis>=5.0.0",
    "ortools>=9.10.0",
    "xgboost>=2.0.0",
    "scikit-learn>=1.5.0",
    "shap>=0.45.0",
    "networkx>=3.3",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "ml*"]
